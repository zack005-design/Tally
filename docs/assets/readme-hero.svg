<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title description">
  <title id="title">Tally — personal spending and shared bills, on your phone</title>
  <desc id="description">The Tally mark and the words Know where every rupee goes, beside a phone showing a total balance, accounts and a shared dinner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F8FF"/><stop offset="1" stop-color="#E4EEFF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2F86FF"/><stop offset="1" stop-color="#0A5BEA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A3D99" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1280" height="460" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="80" r="260" fill="#0A66FF" opacity=".06"/>
  <circle cx="900" cy="470" r="190" fill="#0A66FF" opacity=".05"/>

  <!-- Wordmark -->
  <rect x="72" y="62" width="52" height="52" rx="14" fill="url(#brand)"/>
  <path d="M88 76v24M98 76v24M108 76v24M84 96l28-14" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <text x="138" y="100" fill="#0A5BEA" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="700">tally</text>

  <!-- Headline -->
  <text x="70" y="210" fill="#0B1424" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5">Know where every</text>
  <text x="70" y="282" fill="#0B1424" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5">rupee goes.</text>
  <text x="72" y="336" fill="#4A5568" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="23">Personal spending, shared bills and receipts —</text>
  <text x="72" y="368" fill="#4A5568" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="23">private, offline, and only on your phone.</text>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="860" y="40" width="300" height="440" rx="40" fill="#FFFFFF"/>
  </g>
  <rect x="860" y="40" width="300" height="440" rx="40" fill="none" stroke="#D6E2F5" stroke-width="2"/>
  <text x="890" y="104" fill="#0B1424" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="26" font-weight="700">Overview</text>
  <text x="1010" y="146" fill="#6B7689" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">TOTAL AVAILABLE</text>
  <text x="1010" y="190" fill="#0B1424" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="38" font-weight="700" text-anchor="middle">₹24,580</text>
  <rect x="884" y="214" width="252" height="92" rx="16" fill="#F5F8FF"/>
  <rect x="898" y="230" width="26" height="22" rx="7" fill="#DCE8FF"/>
  <text x="936" y="247" fill="#0B1424" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15">Bank</text>
  <text x="1122" y="247" fill="#0B1424" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" text-anchor="end">₹23,580</text>
  <rect x="898" y="268" width="26" height="22" rx="7" fill="#DCE8FF"/>
  <text x="936" y="285" fill="#0B1424" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15">Cash</text>
  <text x="1122" y="285" fill="#0B1424" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" text-anchor="end">₹1,000</text>
  <text x="890" y="346" fill="#0B1424" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="700">Latest</text>
  <rect x="884" y="362" width="252" height="64" rx="16" fill="#F5F8FF"/>
  <rect x="898" y="376" width="36" height="36" rx="10" fill="#FFE7DA"/>
  <text x="946" y="391" fill="#0B1424" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600">Shared dinner</text>
  <text x="946" y="410" fill="#6B7689" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11">Your share ₹222.50</text>
  <text x="1122" y="398" fill="#0B1424" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">−₹890</text>
</svg>
