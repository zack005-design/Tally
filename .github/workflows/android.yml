name: Android checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual release runs get their own group, so check runs on main never replace a queued release.
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'release' || 'checks' }}
  # Only replace superseded pull-request runs. Runs on main queue instead, so a push never
  # cancels checks for the previous commit or a release that is being published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Tests, lint and debug APK (AI=${{ matrix.tally-ai }})
    strategy:
      matrix:
        tally-ai: ['true', 'false']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TALLY_DEBUG_KEYSTORE_BASE64: ${{ secrets.TALLY_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      # Published APKs must keep the existing development signing identity so they install
      # over earlier releases. The keystore comes from a repository secret, never the source tree.
      - name: Install the Tally development signing key
        if: env.TALLY_DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          # Pasted secrets can pick up spaces, Windows line breaks or certutil's BEGIN/END lines;
          # strip them before decoding.
          printf '%s\n' "$TALLY_DEBUG_KEYSTORE_BASE64" | tr -d '\r' | grep -v -- '-----' | tr -d ' \n\t' | base64 --decode > ~/.android/debug.keystore || {
            echo "::error::TALLY_DEBUG_KEYSTORE_BASE64 is not valid base64. Replace the secret as described in docs/release-signing.md (Publish development builds from GitHub)."; exit 1; }
          test -s ~/.android/debug.keystore

      - name: Run unit tests, Android lint and compile APK
        run: ./gradlew -PtallyAi=${{ matrix.tally-ai }} :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDev --no-daemon --stacktrace

      - name: Save debug and optimised APKs
        uses: actions/upload-artifact@v4
        with:
          name: tally-apk-ai-${{ matrix.tally-ai }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/dev/app-dev.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports-ai-${{ matrix.tally-ai }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  data-safety:
    name: Database and phone compatibility (API ${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        # Android 17 images are published as android-37.0, not android-37.
        api: [26, 35, 36, '37.0']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test migrations and rejected restores on a disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: ./gradlew -I tools/data-safety-build.init.gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.smartexpense.InstallationDataSafetyTest,com.smartexpense.BackupTest,com.smartexpense.LocalReminderAndExportTest,com.smartexpense.ReminderEfficiencyTest,com.smartexpense.SharedRefundRepositoryTest,com.smartexpense.SharedRefundUiTest,com.smartexpense.LocalCommandModelTest,com.smartexpense.DistributionVariantTest,com.smartexpense.EditorialAdaptiveTest,com.smartexpense.QuickExpenseWidgetTest,com.smartexpense.EditorialPickerTest,com.smartexpense.ExactGroupDefaultsUiTest,com.smartexpense.AppearanceSettingsTest,com.smartexpense.YearSummaryUiTest,com.smartexpense.TagsRepositoryTest --no-daemon --console=plain --max-workers=2
      - name: Save device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-compatibility-api-${{ matrix.api }}
          path: |
            .build-cache/data-safety/app/reports/androidTests/
            .build-cache/data-safety/app/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  # Manual runs publish a development prerelease, only after every check above passes
  # and only when the published APK carries the existing development certificate.
  publish:
    name: Publish development prerelease
    if: github.event_name == 'workflow_dispatch'
    needs: [verify, data-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      EXPECTED_CERT_SHA256: 7ddc9c94f93053522c6048694ff19436bc1333a18654d10be26d646e32b8b865
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: tally-apk-ai-*
          path: apks
      - name: Name APKs and check signing, app ID and version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          # Only the AI edition is published. The non-AI build above still runs every check, so
          # the rule-based fallback keeps working when a model cannot load on a phone.
          # The optimised dev build is published: it is signed with the development key like the debug build,
          # but not debuggable, so animations run smoothly on phones.
          cp apks/tally-apk-ai-true/dev/app-dev.apk "out/tally-$version.apk"
          for apk in out/*.apk; do
            cert=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk is signed with $cert, not the existing development certificate. Add the TALLY_DEBUG_KEYSTORE_BASE64 secret."
              exit 1
            fi
            badging=$("$tools/aapt2" dump badging "$apk")
            echo "$badging" | grep -q "package: name='com.smartexpense' versionCode='$code' versionName='$version'"
            if echo "$badging" | grep -q "uses-permission: name='android.permission.INTERNET'"; then echo "::error::$apk requests Internet access"; exit 1; fi
            if echo "$badging" | grep -q "application-debuggable"; then echo "::error::$apk is debuggable and would run slowly"; exit 1; fi
          done
          (cd out && sha256sum *.apk > "tally-$version-SHA256SUMS.txt" && cat "tally-$version-SHA256SUMS.txt")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION-$(date -u +%Y%m%d)"
          # A version can be published once per day. Stop with a clear message instead of
          # gh's bare "already exists" error when a manual run is repeated.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump versionName and versionCode in app/build.gradle.kts and add docs/releases/<version>.md before publishing again, or delete $tag first if it must be replaced."
            exit 1
          fi
          # The notes use links relative to docs/releases/, which break on the release page.
          # Point them at the published commit instead.
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
          sed -E -e "s#\]\(\.\./\.\./#](${base}/#g" -e "s#\]\(\.\./#](${base}/docs/#g" \
            -e "s#\]\(([^)h#][^)]*)\)#](${base}/docs/releases/\1)#g" "docs/releases/$VERSION.md" > release-notes.md
          # The release title is the notes' first heading, for example "Tally 0.2.5 — iOS-style redesign".
          title=$(sed -n 's/^# //p' "docs/releases/$VERSION.md" | head -1)
          gh release create "$tag" out/* --prerelease --target "$GITHUB_SHA" \
            --title "${title:-Tally $VERSION}" --notes-file release-notes.md
