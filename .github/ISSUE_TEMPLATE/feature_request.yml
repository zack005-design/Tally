name: Feature request
description: Propose an improvement to a Tally workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Describe the task you are trying to complete.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Explain the result you would like to see in the app.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
